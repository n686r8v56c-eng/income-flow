<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f4fc"><title>Income Flow</title><style>
:root{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#2b2434;background:#f7f5fa}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}input,select,textarea{outline-color:#ad91dd}.shell{max-width:1180px;margin:auto;min-height:100vh;display:grid;grid-template-columns:208px minmax(0,1fr)}aside{padding:32px 17px;background:#fff;border-right:1px solid #eee9f3;position:sticky;top:0;height:100vh}.brand{font-weight:850;font-size:24px;color:#7d59b4;margin:0 0 8px 12px}.tagline{font-size:11px;color:#9b91a5;margin:0 0 30px 12px}.nav{display:flex;align-items:center;gap:12px;width:100%;padding:13px 15px;background:transparent;color:#6a6272;text-align:left;border-radius:12px;margin:3px 0;font-weight:600}.nav.active{background:#eee6fa;color:#754fac}.nav b{width:22px;font-size:18px}main{padding:34px 40px 110px;max-width:100%;overflow:hidden}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}.top h1{font-size:26px;margin:0 0 5px}.sub{color:#948a9c;font-size:13px;margin:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:20px}.card{background:#fff;border:1px solid #eee8f2;border-radius:17px;padding:20px;box-shadow:0 3px 18px #35204606;min-width:0}.stat{font-size:23px;font-weight:750;margin:9px 0 0;overflow-wrap:anywhere}.muted{color:#91879b;font-size:12px}.purple{color:#8d67c8}.green{color:#319678}.flex{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.stack{display:flex;flex-direction:column;gap:12px}.pill{display:inline-block;border-radius:20px;background:#f0eaf8;color:#835dae;padding:5px 9px;font-size:11px;font-weight:700}.btn{background:#9070c7;color:white;padding:10px 15px;border-radius:11px;font-weight:700}.btn.secondary{color:#75599d;background:#f0e9f9}.btn.ghost{color:#8c759d;background:transparent;padding:8px}.btn.danger{color:#b04b73;background:#fff0f5}.btn:disabled{opacity:.4}.bar{background:#f0edf3;border-radius:20px;height:12px;overflow:hidden}.bar>div{height:100%;background:#a789df;border-radius:20px;transition:width .2s}.sectiontitle{font-size:17px;margin:0 0 14px}.item{padding:13px 0;border-bottom:1px solid #f0ebf4}.item:last-child{border:0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.field{display:flex;flex-direction:column;gap:7px;font-size:12px;color:#6c6074;font-weight:650}input,textarea,select{background:#fff;border:1px solid #e7deec;border-radius:10px;padding:10px 12px;width:100%;color:#30283a;min-width:0}textarea{min-height:85px;resize:vertical}input[type=checkbox]{width:17px;height:17px;accent-color:#926ecb}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.wide{grid-column:1/-1}.empty{padding:35px 12px;text-align:center;color:#9c90a4}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:15px}.toolbar input,.toolbar select{width:auto;min-width:135px}.mini{font-size:12px}.text-right{text-align:right}.notes{font-size:12px;color:#8c8194;line-height:1.6}.tabs{display:none}.overlay{position:fixed;inset:0;background:#2d183c77;display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}.modal{background:white;border-radius:20px;padding:23px;max-width:620px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 18px 90px #1b102a33}.modal h2{margin:0 0 20px}.action{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.chip{border-radius:8px;padding:6px 9px;background:#faf7fc;color:#7f6990;font-size:12px}.listbuttons{display:flex;gap:5px}.money{font-variant-numeric:tabular-nums}.chart{display:flex;align-items:flex-end;gap:9px;height:180px;padding:12px 5px 3px;border-bottom:1px solid #ebe4ee}.chartcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:end;height:100%;gap:7px}.chartbar{width:min(45px,85%);background:#ac91dd;border-radius:7px 7px 0 0;min-height:2px}.chartlabel{font-size:10px;color:#948a9d}.hdivider{height:1px;background:#f1eaf3;margin:14px 0}.foot{color:#9b91a5;font-size:12px;line-height:1.7}.callout{background:#f3eefb;border-radius:13px;padding:14px;color:#6f568c;font-size:13px}.mobile-title{display:none}
@media(max-width:950px){.shell{grid-template-columns:1fr}aside{display:none}main{padding:25px 20px 110px}.tabs{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee8f1;justify-content:space-around;padding:7px 5px calc(8px + env(safe-area-inset-bottom));z-index:20}.tabs button{font-size:9px;background:transparent;color:#95879f;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;flex:1}.tabs button span{font-size:18px}.tabs button.active{color:#865ac4;font-weight:800}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.mobile-title{display:block;font-weight:800;color:#865ac4;margin-bottom:16px}}

</style></head><body><div class="shell"><aside><div class="brand">Income Flow ✦</div><div class="tagline">MY INCOME STUDIO</div><div id="side"></div><div class="foot" style="padding:15px;margin-top:24px">💜 벌 수 있는 방법을 발견하고<br>실제 매출까지 연결하기</div></aside><main><div class="mobile-title">Income Flow ✦</div><div id="app"></div></main></div><nav class="tabs" id="mobile"></nav><div id="modal-root"></div><script>
const KE='income-flow-v1';const icons=['⌂','✦','▣','▦','₩','▥','◎'];const tabs=[['home','홈'],['ideas','아이디어'],['projects','프로젝트'],['action','실행'],['income','수익'],['analysis','분석'],['goals','목표']];const types=['앱·디지털 상품','전문 서비스·프리랜서','판매·커머스','아르바이트·부업','투자·자산 수익'];const ym=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;const iso=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const id=()=>globalThis.crypto?.randomUUID?.()||String(Date.now()+Math.random());const initial=()=>({goals:{'2026-11':300000,'2026-12':1200000,'2027-01':3000000},ideas:[],projects:[],tasks:[],transactions:[],expenses:[],experiments:[],settings:{month:'2026-11'}});let state;try{state={...initial(),...JSON.parse(localStorage.getItem(KE)||'{}')}}catch{state=initial()}let tab='home';const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'₩'+Math.round(Number(n)||0).toLocaleString('ko-KR');const num=n=>Number(n)||0;const save=()=>localStorage.setItem(KE,JSON.stringify(state));const projectName=x=>state.projects.find(p=>p.id===x)?.name||'미지정';const isRevenue=t=>!['아르바이트·부업','투자·자산 수익'].includes(t.type);const current=()=>state.settings.month||ym();const monthMatch=(t,m)=>String(t.date||'').startsWith(m);const sum=(a,fn)=>a.reduce((v,x)=>v+fn(x),0);const validRevenue=()=>state.transactions.filter(t=>monthMatch(t,current())&&isRevenue(t)&&t.status!=='예상');const sales=()=>sum(validRevenue(),t=>num(t.amount)*(t.refund?-1:1));const collected=()=>sum(state.transactions.filter(t=>monthMatch(t.paidDate||t.date,current())&&t.status==='입금'&&isRevenue(t)),t=>num(t.amount)*(t.refund?-1:1));const forecast=()=>sum(state.transactions.filter(t=>monthMatch(t,current())&&t.status==='예상'&&isRevenue(t)),t=>num(t.amount)*(t.refund?-1:1));const costs=()=>sum(state.expenses.filter(t=>monthMatch(t.date,current())),t=>num(t.amount));const goal=()=>num(state.goals[current()]);function navigate(t){tab=t;render();window.scrollTo(0,0)}function nav(){const b=(t,i,cls)=>`<button class="${cls} ${tab===t[0]?'active':''}" onclick="navigate('${t[0]}')"><span>${icons[i]}</span>${t[1]}</button>`;$('side').innerHTML=tabs.map((t,i)=>b(t,i,'nav')).join('');$('mobile').innerHTML=tabs.map((t,i)=>b(t,i,'')).join('')};const head=(title,subtitle,action='')=>`<div class="top"><div><h1>${title}</h1><p class="sub">${subtitle}</p></div>${action}</div>`;const card=(x,extra='')=>`<section class="card ${extra}">${x}</section>`;const stat=(t,v,color='')=>`<div class="card"><div class="muted">${t}</div><div class="stat money ${color}">${v}</div></div>`;const badge=t=>`<span class="pill">${esc(t)}</span>`;const btn=(t,fn,cls='')=>`<button class="btn ${cls}" onclick="${fn}">${t}</button>`;const progress=(a,b)=>`<div class="bar"><div style="width:${b?Math.min(100,Math.max(0,a/b*100)):0}%"></div></div>`;const empty=t=>`<div class="empty">${t}</div>`;const editControls=(kind,x)=>`<div class="listbuttons">${btn('수정',`editItem('${kind}','${x}')`,'secondary mini')}${btn('삭제',`removeItem('${kind}','${x}')`,'ghost mini')}</div>`;const tableItem=(title,detail,buttons)=>`<div class="item row"><div style="min-width:0"><b>${title}</b><div class="notes">${detail}</div></div>${buttons}</div>`;function render(){nav();let view=({home,ideas,projects,action,income,analysis,goals})[tab]();$('app').innerHTML=view;if(tab==='goals')updateCalc()}function monthPicker(){return `<input type="month" style="max-width:160px" value="${esc(current())}" onchange="state.settings.month=this.value;save();render()">`}
function home(){const g=goal(),s=sales(),remaining=Math.max(0,g-s);const tasks=state.tasks.filter(t=>!t.done).sort((a,b)=>String(a.date).localeCompare(String(b.date))).slice(0,5);return head('수익 대시보드','목표를 정하고, 실행하고, 실제 매출을 만드세요.',monthPicker())+`<div class="stats">${stat('이번 달 목표',money(g))}${stat('확정 매출',money(s),'purple')}${stat('실제 입금',money(collected()),'green')}${stat('부족한 매출',money(remaining))}</div>`+card(`<div class="row"><h2 class="sectiontitle">월 매출 달성률</h2>${badge(g?Math.round(s/g*100)+'%':'목표 미설정')}</div>${progress(s,g)}<p class="notes">예상 매출 ${money(forecast())} · 비용 ${money(costs())} · 단순 매출-기록비용 ${money(s-costs())}</p>`)+`<div class="grid" style="margin-top:14px">`+card(`<div class="row"><h2 class="sectiontitle">실행할 일</h2>${btn('+ 추가',"openForm('task')",'secondary')}</div>${tasks.length?tasks.map(t=>`<div class="item flex"><input type="checkbox" onchange="toggleTask('${t.id}')"><div style="flex:1"><b>${esc(t.name)}</b><div class="notes">${esc(t.date)} · ${esc(projectName(t.projectId))}</div></div></div>`).join(''):empty('아직 할 일이 없어요. 첫 매출 활동을 등록해보세요.')}`)+card(`<div class="row"><h2 class="sectiontitle">진행 프로젝트</h2>${btn('+ 추가',"openForm('project')",'secondary')}</div>${state.projects.length?state.projects.slice(0,5).map(p=>tableItem(esc(p.name),`${esc(p.type)} · 목표 ${money(p.target)} · ${esc(p.status)}`,`<button class="btn secondary" onclick="navigate('projects')">보기</button>`)).join(''):empty('첫 번째 수익 프로젝트를 만들어보세요.')}`)+`</div>`+card(`<h2 class="sectiontitle">수익 전략 알림</h2><div class="callout">${s===0?'아직 확정 매출이 없어요. 첫 고객·첫 유료 판매를 검증하는 작은 실험부터 시작해보세요.':remaining>0?`${money(remaining)}이 더 필요해요. 실행 탭에서 신규 고객 확보나 판매 활동을 계획해보세요.`:'이번 달 매출 목표에 도달했어요! 수익성과 반복 가능한 판매 채널을 분석해보세요.'}</div>`,'');}
function ideas(){let rows=state.ideas;return head('수익 아이디어','가능성을 모으고 검증한 다음 프로젝트로 전환하세요.',btn('+ 아이디어',"openForm('idea')"))+`<div class="toolbar"><select onchange="filterList('ideas',this.value)"><option value="">전체 카테고리</option>${types.map(t=>`<option>${t}</option>`).join('')}</select><input placeholder="아이디어 검색" oninput="searchList('ideas',this.value)"></div>`+card(`<div id="ideas-list">${ideaRows(rows)}</div>`)}function ideaRows(rows){return rows.length?rows.map(x=>tableItem(esc(x.name),`${badge(x.type)} ${badge(x.status)}<br>예상 매출 ${money(x.expected)} · 초기비용 ${money(x.cost)}<br>${esc(x.note||'')}`,`<div class="stack">${btn('프로젝트 전환',`convertIdea('${x.id}')`,'secondary mini')}${editControls('idea',x.id)}</div>`)).join(''):empty('아이디어를 하나 등록해보세요.')}function filterList(which,val){window._filter=val;filterRows()}function searchList(which,val){window._search=val;filterRows()}function filterRows(){const items=state.ideas.filter(x=>(!window._filter||x.type===window._filter)&&(!window._search||x.name.toLowerCase().includes(window._search.toLowerCase())));$('ideas-list').innerHTML=ideaRows(items)}function convertIdea(x){const item=state.ideas.find(v=>v.id===x);if(!item)return;state.projects.push({id:id(),name:item.name,type:item.type,target:item.expected||0,status:'준비',description:item.note||'',ideaId:item.id});item.status='프로젝트 전환';save();navigate('projects')}
function projects(){return head('수익 프로젝트','아이디어를 실제로 돈을 버는 프로젝트로 만드세요.',btn('+ 프로젝트',"openForm('project')"))+`<div class="grid">${state.projects.length?state.projects.map(p=>{const ts=state.tasks.filter(t=>t.projectId===p.id);const rev=sum(state.transactions.filter(t=>t.projectId===p.id&&t.status!=='예상'&&isRevenue(t)),t=>num(t.amount)*(t.refund?-1:1));return card(`<div class="row"><b>${esc(p.name)}</b>${badge(p.status)}</div><p class="notes">${esc(p.type)}<br>${esc(p.description||'')}</p><div class="row"><span class="muted">매출 ${money(rev)}</span><b>${money(p.target)}</b></div>${progress(rev,num(p.target))}<p class="notes">할 일 ${ts.filter(x=>x.done).length}/${ts.length}건 완료</p>${editControls('project',p.id)}`)}).join(''):card(empty('프로젝트를 추가하면 이곳에 카드로 나타나요.'))}</div>`}
function action(){const rows=[...state.tasks].sort((a,b)=>String(a.date).localeCompare(String(b.date)));return head('수익 실행','준비·홍보·판매·납품·회수 활동을 관리하세요.',btn('+ 할 일',"openForm('task')"))+card(`<h2 class="sectiontitle">실행 목록</h2>${rows.length?rows.map(t=>`<div class="item row"><div class="flex" style="min-width:0"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}')"><div><b style="${t.done?'text-decoration:line-through;color:#aaa':''}">${esc(t.name)}</b><div class="notes">${esc(t.date)} · ${esc(t.kind)} · ${esc(projectName(t.projectId))}</div></div></div>${editControls('task',t.id)}</div>`).join(''):empty('수익 활동을 추가하고 완료를 체크해보세요.')}`)}function toggleTask(x){const t=state.tasks.find(t=>t.id===x);if(t){t.done=!t.done;save();render()}}
function income(){const rows=[...state.transactions].sort((a,b)=>String(b.date).localeCompare(String(a.date)));return head('수익 기록','예상·확정·입금을 구분하고 매출과 기타 소득을 분리해요.',btn('+ 거래',"openForm('transaction')"))+`<div class="stats">${stat('확정 매출',money(sales()))}${stat('입금 매출',money(collected()))}${stat('예상 매출',money(forecast()))}${stat('기록 비용',money(costs()))}</div><div class="toolbar">${btn('+ 비용 입력',"openForm('expense')",'secondary')}${btn('수익·비용 CSV',"exportCSV()",'secondary')}</div>`+card(`<h2 class="sectiontitle">거래 내역</h2>${rows.length?rows.map(t=>tableItem(`${esc(t.name)} ${t.refund?'<span class="pill">환불</span>':''}`,`${esc(t.date)} · ${esc(t.type)} · ${badge(t.status)} · ${esc(projectName(t.projectId))}<br>${isRevenue(t)?'매출':'기타 소득'} · ${money(t.amount)}${t.paidDate?' · 입금일 '+esc(t.paidDate):''}`,editControls('transaction',t.id))).join(''):empty('거래가 아직 없어요. 예상 매출이나 확정 거래를 등록해보세요.')}`)+`<div style="height:14px"></div>`+card(`<h2 class="sectiontitle">비용 내역</h2>${state.expenses.length?state.expenses.map(x=>tableItem(esc(x.name),`${esc(x.date)} · ${esc(projectName(x.projectId))} · ${money(x.amount)}`,editControls('expense',x.id))).join(''):empty('사업 관련 비용을 기록해보세요.')}`)}
function analysis(){const months=Array.from(new Set([...Object.keys(state.goals),...state.transactions.map(x=>String(x.date).slice(0,7))])).sort();const vals=months.map(m=>sum(state.transactions.filter(t=>monthMatch(t,m)&&t.status!=='예상'&&isRevenue(t)),t=>num(t.amount)*(t.refund?-1:1)));const max=Math.max(1,...vals,...months.map(m=>num(state.goals[m])));const byType=types.map(type=>({type,value:sum(validRevenue().filter(t=>t.type===type),t=>num(t.amount)*(t.refund?-1:1))}));return head('수익 분석','매출 추이, 수익원 비중, 실제 성과를 확인해요.',monthPicker())+card(`<h2 class="sectiontitle">월별 매출</h2><div class="chart">${months.map((m,i)=>`<div class="chartcol"><div class="muted money">${vals[i]?Math.round(vals[i]/10000)+'만':''}</div><div class="chartbar" title="${m}: ${money(vals[i])}" style="height:${Math.max(2,vals[i]/max*125)}px"></div><div class="chartlabel">${esc(m.slice(2))}</div></div>`).join('')}</div><p class="notes">막대는 실제 기록된 매출을 나타내며 목표와 별개입니다.</p>`)+`<div class="grid" style="margin-top:14px">`+card(`<h2 class="sectiontitle">수익원별 매출</h2>${byType.map(x=>`<div class="item"><div class="row"><span class="mini">${esc(x.type)}</span><b class="mini">${money(x.value)}</b></div>${progress(x.value,Math.max(1,sales()))}</div>`).join('')}`)+card(`<h2 class="sectiontitle">이번 달 지표</h2>${tableItem('확정 매출',money(sales()),'')}${tableItem('기록된 비용',money(costs()),'')}${tableItem('매출 - 비용',money(sales()-costs()),'')}${tableItem('완료 작업',state.tasks.filter(x=>x.done).length+'건','')}${tableItem('등록 프로젝트',state.projects.length+'개','')}`)+`</div>`}
function goals(){const ms=Object.entries(state.goals).sort(([a],[b])=>a.localeCompare(b));return head('목표 관리','월 매출 목표를 설정하고, 필요한 판매량을 역산해보세요.',btn('+ 월 목표',"openForm('goal')"))+`<div class="grid">`+card(`<h2 class="sectiontitle">월별 목표</h2>${ms.map(([m,v])=>tableItem(esc(m),money(v),`<div class="listbuttons">${btn('수정',`editGoal('${m}')`,'secondary mini')}${btn('삭제',`deleteGoal('${m}')`,'ghost mini')}</div>`)).join('')}`)+card(`<h2 class="sectiontitle">목표 역산 계산기</h2><div class="stack"><label class="field">건당 판매가<input id="calc-price" type="number" min="1" value="300000" oninput="updateCalc()"></label><label class="field">구매 전환율 (%)<input id="calc-conversion" type="number" min="1" max="100" value="15" oninput="updateCalc()"></label><div class="callout" id="calc-result"></div><p class="notes">전환율은 검증 전까지 가정값입니다. 확정 매출 목표는 자동으로 변경되지 않아요.</p></div>`)+`</div><div class="toolbar" style="margin-top:14px">${btn('JSON 백업',"exportJSON()",'secondary')}<label class="btn secondary" style="cursor:pointer">JSON 가져오기<input type="file" accept="application/json" style="display:none" onchange="importJSON(this)"></label>${btn('전체 초기화',"resetAll()",'danger')}</div><p class="foot">기록은 현재 브라우저의 로컬 저장소에 보관됩니다. 다른 기기 자동 동기화와 로그인은 Supabase 연결 이후 지원됩니다. 정기적으로 JSON 백업을 권장합니다.</p>`}
function updateCalc(){const p=num($('calc-price')?.value),c=num($('calc-conversion')?.value),g=goal(),count=p?Math.ceil(g/p):0,leads=c?Math.ceil(count/(c/100)):0;if($('calc-result'))$('calc-result').innerHTML=`${esc(current())} 목표 ${money(g)}<br><b>필요한 판매 ${count}건</b><br>가정한 전환율에 필요한 문의 ${c?leads+'명':'계산 불가'}`}
function modal(html){$('modal-root').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}function closeModal(){$('modal-root').innerHTML=''}const fields={idea:[['name','아이디어 이름','text',true],['type','수익 카테고리','type'],['status','상태','ideaStatus'],['expected','예상 월 매출','number'],['cost','초기 비용','number'],['note','메모','textarea']],project:[['name','프로젝트 이름','text',true],['type','수익 카테고리','type'],['status','진행 상태','projectStatus'],['target','매출 목표','number'],['description','설명','textarea']],task:[['name','활동 이름','text',true],['date','실행 날짜','date'],['kind','활동 유형','kind'],['projectId','연결 프로젝트','project'],['note','메모','textarea']],transaction:[['name','거래 이름','text',true],['type','수익 카테고리','type'],['projectId','연결 프로젝트','project'],['amount','금액 (원)','number',true],['date','매출·소득 발생일','date'],['status','상태','transactionStatus'],['paidDate','실제 입금일','date'],['refund','환불·취소','checkbox'],['note','메모','textarea']],expense:[['name','비용 이름','text',true],['amount','비용 금액','number',true],['date','지출 날짜','date'],['projectId','연결 프로젝트','project'],['note','메모','textarea']]};const collections={idea:'ideas',project:'projects',task:'tasks',transaction:'transactions',expense:'expenses'};const opts=(arr,val)=>arr.map(v=>`<option value="${esc(v)}" ${String(v)===String(val)?'selected':''}>${esc(v)}</option>`).join('');function renderField(f,value){const [key,label,type,required]=f;const val=value?.[key]??(type==='date'&&key!=='paidDate'?iso():type==='number'?0:'');const name=`name="${key}"`;const select=(arr)=>`<select ${name}>${opts(arr,val)}</select>`;let el=type==='textarea'?`<textarea ${name}>${esc(val)}</textarea>`:type==='type'?select(types):type==='ideaStatus'?select(['보관','조사 중','검증 중','프로젝트 전환','보류']):type==='projectStatus'?select(['준비','검증','판매 중','운영','완료','보류']):type==='kind'?select(['준비','홍보','판매','납품','회수','기타']):type==='transactionStatus'?select(['예상','확정','입금']):type==='project'?`<select ${name}><option value="">미지정</option>${state.projects.map(p=>`<option value="${esc(p.id)}" ${p.id===val?'selected':''}>${esc(p.name)}</option>`).join('')}</select>`:type==='checkbox'?`<input type="checkbox" ${name} ${val?'checked':''}>`:`<input ${name} type="${type}" ${type==='number'?'min="0"':''} value="${esc(val)}" ${required?'required':''}>`;return `<label class="field ${type==='textarea'?'wide':''}">${label}${el}</label>`}function openForm(kind,existingId){const collection=collections[kind],old=state[collection].find(x=>x.id===existingId);modal(`<h2>${old?'수정':'새 항목 추가'}</h2><form id="editor" onsubmit="submitForm(event,'${kind}','${existingId||''}')"><div class="formgrid">${fields[kind].map(f=>renderField(f,old)).join('')}</div><div class="action">${btn('취소','closeModal()','secondary')}<button type="submit" class="btn">저장</button></div></form>`)}function submitForm(e,kind,x){e.preventDefault();const form=e.target,d=new FormData(form),o=Object.fromEntries(d.entries());for(const f of fields[kind]){if(f[2]==='number')o[f[0]]=num(o[f[0]]);if(f[2]==='checkbox')o[f[0]]=form.elements[f[0]].checked}if(kind==='transaction'&&o.status==='입금'&&!o.paidDate)o.paidDate=iso();const collection=collections[kind];if(x){const existing=state[collection].find(v=>v.id===x);Object.assign(existing,o)}else state[collection].push({id:id(),...o,...(kind==='task'?{done:false}:{})});save();closeModal();render()}function editItem(kind,x){openForm(kind,x)}function removeItem(kind,x){if(!confirm('이 항목을 삭제할까요?'))return;state[collections[kind]]=state[collections[kind]].filter(t=>t.id!==x);save();render()}
function openGoal(m){const value=state.goals[m]??300000;modal(`<h2>${m?'목표 수정':'새 월 목표'}</h2><form onsubmit="submitGoal(event,'${m||''}')"><div class="formgrid"><label class="field">대상 월<input type="month" name="month" value="${m||ym()}" ${m?'readonly':''} required></label><label class="field">목표 매출<input type="number" name="amount" min="0" value="${value}" required></label></div><div class="action">${btn('취소','closeModal()','secondary')}<button class="btn">저장</button></div></form>`)}function submitGoal(e,m){e.preventDefault();const d=new FormData(e.target);state.goals[d.get('month')]=num(d.get('amount'));state.settings.month=d.get('month');save();closeModal();render()}function editGoal(m){openGoal(m)}function deleteGoal(m){if(confirm(m+' 목표를 삭제할까요?')){delete state.goals[m];save();render()}}function exportJSON(){download('income-flow-backup-'+iso()+'.json',JSON.stringify(state,null,2),'application/json')}function download(n,v,type){const b=new Blob([v],{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function exportCSV(){const a=[['구분','항목','카테고리','금액','날짜','상태','프로젝트']];state.transactions.forEach(t=>a.push(['수익',t.name,t.type,(t.refund?-1:1)*num(t.amount),t.date,t.status,projectName(t.projectId)]));state.expenses.forEach(t=>a.push(['비용',t.name,'',num(t.amount),t.date,'',projectName(t.projectId)]));download('income-flow-'+iso()+'.csv','\ufeff'+a.map(r=>r.map(s=>'"'+String(s??'').replaceAll('"','""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}async function importJSON(input){const file=input.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data.ideas)||!Array.isArray(data.transactions)||!data.goals)throw Error('백업 형식이 일치하지 않습니다');if(confirm('현재 데이터를 백업 파일 내용으로 교체할까요?')){state={...initial(),...data};save();render()}}catch(e){alert('불러오기 실패: '+e.message)}}function resetAll(){if(confirm('모든 수익 기록을 초기화할까요? 복구할 수 없으므로 먼저 백업하세요.'))if(confirm('정말로 전체 삭제할까요?')){state=initial();save();render()}}
render();
</script></body></html>
